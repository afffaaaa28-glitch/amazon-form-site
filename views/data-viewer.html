<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض البيانات - Amazon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #F3F3F3 0%, #E8E8E8 100%);
            min-height: 100vh;
        }
        .data-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-right: 5px solid #FF9900;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: linear-gradient(135deg, #131A22 0%, #1A2533 100%);
            color: white;
            padding: 20px 24px;
            border-bottom: 3px solid #FF9900;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #FF9900 0%, #FFB84D 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover {
            transform: scale(1.05);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            padding: 16px 28px;
            border-radius: 14px;
            display: none;
            animation: slideUp 0.5s ease;
            z-index: 1000;
            font-weight: 600;
        }
        .toast.show {
            display: block;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF9900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .badge {
            background: #FF9900;
            color: white;
            border-radius: 50%;
            padding: 2px 10px;
            font-size: 13px;
            font-weight: bold;
            margin-right: 8px;
        }
        .empty-state {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-align: center;
        }
        pre {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
            background: #f9f9f9;
            padding: 16px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="header flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-black text-[#FF9900]">amazon</span>
            <span class="text-sm text-white/70 bg-white/10 px-3 py-1 rounded-full">📊 عرض البيانات</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="notificationBadge" class="badge" style="display:none;">0</span>
            <button onclick="fetchData()" class="refresh-btn">🔄 تحديث</button>
        </div>
    </div>

    <main class="max-w-5xl mx-auto p-4 md:p-6">

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="stat-card">
                <div class="text-2xl font-bold text-[#FF9900]" id="totalEntries">0</div>
                <div class="text-xs text-gray-500">عدد الإدخالات</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl font-bold text-green-600" id="lastEntryTime">--</div>
                <div class="text-xs text-gray-500">آخر إدخال</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl font-bold text-blue-600" id="todayEntries">0</div>
                <div class="text-xs text-gray-500">اليوم</div>
            </div>
            <div class="stat-card">
                <div class="text-2xl font-bold" id="statusBadge">🟢</div>
                <div class="text-xs text-gray-500">الحالة</div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-[#111111]">📋 سجل البيانات</h1>
            <span class="text-sm text-gray-400" id="lastUpdate">آخر تحديث: --</span>
        </div>

        <div id="dataContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p class="text-gray-500">جاري تحميل البيانات...</p>
            </div>
        </div>
    </main>

    <div id="toast" class="toast">✅ بيانات جديدة وصلت!</div>

    <script>
        let lastData = '';
        let notificationCount = 0;

        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.text();
                
                console.log('📊 البيانات المستلمة:', data.substring(0, 200) + '...');
                
                if (data !== lastData) {
                    lastData = data;
                    displayData(data);
                    if (data.trim()) {
                        showNotification();
                    }
                }
                
                document.getElementById('lastUpdate').textContent = `آخر تحديث: ${new Date().toLocaleTimeString('ar-EG')}`;
                updateStats(data);
                
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('dataContainer').innerHTML = `
                    <div class="bg-red-50 border-2 border-red-200 text-red-700 p-6 rounded-2xl text-center">
                        <div class="text-4xl mb-3">⚠️</div>
                        <h3 class="font-bold text-lg">خطأ في جلب البيانات</h3>
                        <p class="text-sm">تأكد من اتصال الإنترنت</p>
                        <button onclick="fetchData()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700">🔄 إعادة المحاولة</button>
                    </div>
                `;
                document.getElementById('statusBadge').textContent = '🔴';
            }
        }

        function displayData(data) {
            const container = document.getElementById('dataContainer');
            
            if (!data || data.trim() === '') {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="text-6xl mb-4">📭</div>
                        <h3 class="text-2xl font-bold text-gray-700 mb-2">لا توجد بيانات</h3>
                        <p class="text-gray-400">انتظر وصول أول عميل...</p>
                    </div>
                `;
                return;
            }

            // عرض البيانات بشكل مباشر
            container.innerHTML = `
                <div class="data-box" style="border-right-color: #FF9900; background: #FFF8F0;">
                    <div class="text-sm font-bold mb-3" style="color: #FF9900;">
                        📋 البيانات الكاملة
                    </div>
                    <pre>${data}</pre>
                </div>
            `;
            
            document.getElementById('statusBadge').textContent = '🟢';
        }

        function updateStats(data) {
            const sections = data.split(/\n={50,}\n/).filter(s => s.trim());
            document.getElementById('totalEntries').textContent = sections.length || 0;
            
            if (sections.length > 0) {
                const lastSection = sections[sections.length - 1];
                const timeMatch = lastSection.match(/🕐 الوقت: (.+)/);
                if (timeMatch) {
                    document.getElementById('lastEntryTime').textContent = timeMatch[1];
                }
            }
        }

        function showNotification() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            notificationCount++;
            const badge = document.getElementById('notificationBadge');
            badge.style.display = 'inline';
            badge.textContent = notificationCount;
            
            if (Notification.permission === 'granted') {
                new Notification('📬 بيانات جديدة وصلت!', {
                    body: 'تم استلام بيانات جديدة من العميل',
                    icon: '🔔'
                });
            }
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        if (Notification.permission === 'default') {
            Notification.requestPermission();
        }

        fetchData();
        setInterval(fetchData, 10000);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchData();
            }
        });
    </script>

</body>
</html>
